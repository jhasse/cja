[project]
name = "cja"
version = "0.10.1"
description = "CMake-compatible build system that generates Ninja build files"
readme = "README.md"
license = "Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE.txt", "src/cja/cmake/Modules/LICENSE.rst"]
authors = [
    { name = "Jan Niklas Hasse", email = "jhasse@bixense.com" }
]
requires-python = ">=3.10"
dependencies = [
    "rich>=14.3.2",
    "termcolor>=3.3.0",
]

[project.urls]
Repository = "https://github.com/jhasse/cja"

[project.scripts]
cja = "cja.cli:main"

[build-system]
requires = ["uv_build>=0.9.26"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Ship the test suite (and the example projects it builds) and the shell
# completion in the sdist, so that distributions can run and install them.
source-include = ["tests/**", "examples/**", "completions/**"]
source-exclude = ["examples/*/build*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["build", "build-*", "_deps", ".venv", ".git"]
